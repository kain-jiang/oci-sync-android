name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发:随时构建最新 APK 供下载

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      USE_CN_MIRRORS: "false" # GitHub runner 海外网络,走官方源更快更稳

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Use official Gradle distribution on CI
        run: sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK platform 37.1
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -path "*cmdline-tools*" 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0" > /dev/null

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (R8 minify verification)
        run: ./gradlew assembleRelease --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-sync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
